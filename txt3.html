<!DOCTYPE html>
<html>
<head>
    <title>Unordered List</title>
</head>
<body>

    <h1 style="color: blue;">My Favorite Fruits</h1>

    <ul style="color: red;">
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
    </ul>

    <ol type="i" style="color:red;">
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
    </ol>

    <ol type="1">
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
    </ol>

</body>
</html>
